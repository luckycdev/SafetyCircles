<div class="panel-header">
  <h2>Account</h2>
  <button class="close-panel" type="button" aria-label="Close account">x</button>
</div>

<div class="panel-body">
  <form id="account-form" class="form">
    <label>First name
      <input type="text" name="firstName" required />
    </label>
    <label>Last name
      <input type="text" name="lastName" required />
    </label>
    <label>Email
      <input type="email" name="email" required />
    </label>
    <label>Phone number
      <input type="tel" name="phoneNumber" />
    </label>
    <p id="account-status" class="muted"></p>
    <button type="submit" class="primary-button">Save changes</button>
  </form>

  <form id="password-form" class="form">
    <h3>Change password</h3>
    <label>Current password
      <input type="password" name="current" autocomplete="current-password" required />
    </label>
    <label>New password
      <input type="password" name="new" autocomplete="new-password" required />
    </label>
    <label>Repeat new password
      <input type="password" name="repeat" autocomplete="new-password" required />
    </label>
    <p id="password-status" class="muted"></p>
    <button type="submit" class="primary-button">Change password</button>
  </form>

  <button type="button" class="secondary-button" data-open="settings">Back to settings</button>
</div>
