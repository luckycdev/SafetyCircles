<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Safety Circles</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div id="map"></div>

    <div class="info">
      <strong id="user-name"></strong>
      <p id="user-city"></p>
      <p id="user-circle"></p>
    </div>

    <div class="tabs">
      <button data-panel="places">Places</button>
      <button data-panel="map" class="active">Map</button>
      <button data-panel="settings">Settings</button>
    </div>

    <div id="places-panel" class="floating-panel hidden"></div>

    <div id="settings-panel" class="floating-panel hidden"></div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="/index.js"></script>
  </body>
</html>
