<div class="panel-header">
  <h2>Places</h2>
  <button class="close-panel" type="button" aria-label="Close places">x</button>
</div>

<div id="place-list-view" class="panel-body">
  <div id="place-list"></div>
  <button type="button" class="primary-button" data-action="new-place">Create Place</button>
</div>

<form id="place-form" class="panel-body hidden">
  <label>Name
    <input type="text" name="name" maxlength="50" required />
  </label>
  <label>Circle
    <select name="circleId"></select>
  </label>
  <label>Radius (meters)
    <input type="number" name="radius" value="100" min="25" max="5000" required />
  </label>
  <label>Address
    <input type="text" name="address" placeholder="Type an address" />
  </label>
  <div class="button-row">
    <button type="button" class="small-button" data-action="find-address">Find address</button>
    <button type="button" class="small-button" data-action="pick-place">Pick on map</button>
  </div>
  <p id="place-spot" class="muted">No spot chosen yet.</p>
  <p id="place-error" class="error"></p>
  <div class="button-row">
    <button type="button" class="secondary-button" data-action="cancel-place">Cancel</button>
    <button type="submit" class="primary-button">Save place</button>
  </div>
</form>
