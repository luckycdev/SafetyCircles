<div class="panel-header">
  <h2>Settings</h2>
  <button class="close-panel" type="button" aria-label="Close settings">x</button>
</div>

<div class="settings-body">
  <button type="button" class="settings-button">Account Settings</button>

  <div class="setting-row">
    <span>Pause location sharing</span>
    <label class="switch">
      <input type="checkbox" />
      <span class="slider"></span>
    </label>
  </div>

  <a href="#" class="text-link">Notifications</a>

  <div class="setting-row">
    <span>Arrival/Departure Notifications</span>
    <label class="switch">
      <input type="checkbox" checked />
      <span class="slider"></span>
    </label>
  </div>

  <div class="setting-row">
    <span>Low battery notifications</span>
    <label class="switch">
      <input type="checkbox" checked />
      <span class="slider"></span>
    </label>
  </div>

  <div class="setting-row">
    <span>Completed drive notifications</span>
    <label class="switch">
      <input type="checkbox" checked />
      <span class="slider"></span>
    </label>
  </div>

  <div class="setting-row">
    <span>Severe weather notifications</span>
    <label class="switch">
      <input type="checkbox" checked />
      <span class="slider"></span>
    </label>
  </div>
</div>
