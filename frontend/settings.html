<div class="panel-header">
  <h2>Settings</h2>
  <button class="close-panel" type="button" aria-label="Close settings">x</button>
</div>

<div class="settings-body">
  <button type="button" class="settings-button" data-open="account">Account Settings</button>

  <div class="setting-row">
    <span>Pause location sharing</span>
    <label class="switch">
      <input type="checkbox" data-setting="pauseSharing" />
      <span class="slider"></span>
    </label>
  </div>

  <a href="#" class="text-link" data-open="notifications">Notifications</a>

  <div class="setting-row">
    <span>Arrival/Departure Notifications</span>
    <label class="switch">
      <input type="checkbox" data-setting="arrivalNotifications" />
      <span class="slider"></span>
    </label>
  </div>

  <div class="setting-row">
    <span>Low battery notifications</span>
    <label class="switch">
      <input type="checkbox" data-setting="lowBatteryNotifications" />
      <span class="slider"></span>
    </label>
  </div>

  <div class="setting-row">
    <span>Completed drive notifications</span>
    <label class="switch">
      <input type="checkbox" data-setting="completedDriveNotifications" />
      <span class="slider"></span>
    </label>
  </div>

  <div class="setting-row">
    <span>Severe weather notifications</span>
    <label class="switch">
      <input type="checkbox" data-setting="severeWeatherNotifications" />
      <span class="slider"></span>
    </label>
  </div>

  <div class="demo-tools">
    <p class="muted">Demo tools: move the example people to try the notifications.</p>
    <button type="button" class="small-button" data-demo="jessica-arrive">Jessica arrives at a place</button>
    <button type="button" class="small-button" data-demo="jessica-leave">Jessica leaves</button>
    <button type="button" class="small-button" data-demo="vincent-drive">Vincent takes a drive</button>
    <button type="button" class="small-button" data-demo="victoria-battery">Victoria's battery drops</button>
    <p id="demo-status" class="muted"></p>
  </div>
</div>
